version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: sitevisit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitevisit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sitevisit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sitevisit_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitevisit} -d ${POSTGRES_DB:-sitevisit_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitevisit_net

  redis:
    image: redis:7-alpine
    container_name: sitevisit_redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_secret}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sitevisit_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitevisit_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sitevisit}:${POSTGRES_PASSWORD:-sitevisit_secret}@postgres:5432/${POSTGRES_DB:-sitevisit_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
      - /tmp/sitevisit:/tmp/sitevisit
      - sitevisit_media:/data/sitevisit/photos
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitevisit_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitevisit_celery
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sitevisit}:${POSTGRES_PASSWORD:-sitevisit_secret}@postgres:5432/${POSTGRES_DB:-sitevisit_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
      - /tmp/sitevisit:/tmp/sitevisit
      - sitevisit_media:/data/sitevisit/photos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sitevisit_net
    command: >
      celery -A app.workers.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=photo_processing,enrichment,default

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sitevisit_celery_beat
    restart: unless-stopped
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - sitevisit_net
    command: celery -A app.workers.celery_app beat --loglevel=info

  nginx:
    image: nginx:alpine
    container_name: sitevisit_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - sitevisit_media:/data/sitevisit/photos:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sitevisit_net

volumes:
  postgres_data:
  redis_data:
  sitevisit_media:

networks:
  sitevisit_net:
    driver: bridge
